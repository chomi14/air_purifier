<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1460" viewBox="0 0 1500 1460"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#486782"/></marker></defs><rect width="1500" height="1460" fill="#f7f9fc"/>
<text x="60" y="62" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="36" text-anchor="start" font-weight="700">ESP32-S3 · VOC 제어와 활성탄 자동 교체</text>
<text x="60" y="101" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="23" text-anchor="start" font-weight="400">4개 센서 기록 / 출구 VOC로 강·약 제어 / 지속 고값이면 교체</text>
<rect x="430" y="140" width="640" height="100" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="175" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">수동 시작위치 정렬 → z → a → 게이트 닫힘 명령</text>
<text x="750.0" y="206" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">1.5초 대기 후 운전 · 리셋/중단 후 수동 재정렬</text>
<rect x="430" y="285" width="640" height="105" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="320" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">SGP40 × 4 · 매초 측정</text>
<text x="750.0" y="351" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">입구 A/B, 출구 A/B · PCA9548A 채널 0–3</text>
<polyline points="750,240 750,285" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1130" y="285" width="320" height="145" rx="15" fill="#e9f4f0" stroke="#c5d2df" stroke-width="2"/>
<text x="1290.0" y="320" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">USB → 노트북 CSV</text>
<text x="1290.0" y="351" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">센서 4개 · 팬 명령</text>
<text x="1290.0" y="378" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">상태 · 교체 횟수 · 오류</text>
<text x="1290.0" y="405" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">운전·교체·오류 중에도 기록</text>
<polyline points="1070,337 1130,337" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="435" width="640" height="100" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="470" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">4개 모두 정상 측정이 5분 연속 유지됐나?</text>
<text x="750.0" y="501" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">무효·오래된 값은 판정에서 제외</text>
<polyline points="750,390 750,435" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="55" y="435" width="305" height="100" rx="15" fill="#fff2df" stroke="#c5d2df" stroke-width="2"/>
<text x="207.5" y="470" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">준비 / 센서 오류</text>
<text x="207.5" y="501" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">강풍 유지 · 자동 교체 금지</text>
<polyline points="430,485 360,485" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="395" y="470" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="18" text-anchor="middle" font-weight="400">아니오</text>
<polyline points="205,435 205,337 430,337" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="580" width="640" height="130" rx="15" fill="#e9f1ff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="615" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">제어값 = 출구 A/B 중 큰 VOC Index</text>
<text x="750.0" y="646" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">150 이상 15초 → 강풍 100% / 110 이하 60초 → 약풍 40%</text>
<text x="750.0" y="673" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">중간값에서는 현재 강·약 유지</text>
<polyline points="750,535 750,580" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="778" y="563" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="18" text-anchor="middle" font-weight="400">예</text>
<rect x="430" y="755" width="640" height="110" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="790" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">쿨다운 종료 + 강풍에서 VOC ≥ 150이 5분 지속?</text>
<text x="750.0" y="821" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">5분 중 기준 아래로 내려가면 교체 타이머 초기화</text>
<polyline points="750,710 750,755" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="1070,807 1100,807 1100,265 750,265 750,285" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1240" y="700" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="18" text-anchor="middle" font-weight="400">아니오: 측정 반복</text>
<rect x="430" y="915" width="640" height="105" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="950" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">팬 정지 명령 → 5초 대기 → 게이트 열기</text>
<text x="750.0" y="981" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">게이트 열림 대기 1.5초 · 실제 위치 피드백 없음</text>
<polyline points="750,865 750,915" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="779" y="895" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="18" text-anchor="middle" font-weight="400">예</text>
<rect x="430" y="1065" width="640" height="100" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="1100" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">8초 배출 → 게이트 닫힘 명령 → 1.5초 대기</text>
<text x="750.0" y="1131" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">시간으로 배출 · 실제 잔량/질량을 측정하지 않음</text>
<polyline points="750,1020 750,1065" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="1210" width="640" height="100" rx="15" fill="#ffffff" stroke="#c5d2df" stroke-width="2"/>
<text x="750.0" y="1245" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">1초 충전 대기 → 전진 → 좌표0 복귀 × 5회</text>
<text x="750.0" y="1276" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">전진: 설정 스텝 수 / 복귀: 같은 스텝 수 반대로</text>
<polyline points="750,1165 750,1210" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="55" y="1065" width="305" height="150" rx="15" fill="#e9f4f0" stroke="#c5d2df" stroke-width="2"/>
<text x="207.5" y="1100" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">교체 완료 → 강풍 재개</text>
<text x="207.5" y="1131" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">교체 횟수 +1</text>
<text x="207.5" y="1158" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">10분 재교체 판단 금지</text>
<text x="207.5" y="1185" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">그 후 고값 5분 다시 판단</text>
<polyline points="430,1260 205,1260 205,1215" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="55,1140 30,1140 30,265 750,265" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1130" y="1065" width="320" height="175" rx="15" fill="#ffeded" stroke="#c5d2df" stroke-width="2"/>
<text x="1290.0" y="1100" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="24" text-anchor="middle" font-weight="700">기구 오류 / x 중단</text>
<text x="1290.0" y="1131" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">이동 명령 시간 초과</text>
<text x="1290.0" y="1158" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">스텝 정지 · 팬 정지</text>
<text x="1290.0" y="1185" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">자동 재시도 없음</text>
<text x="1290.0" y="1212" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="19" text-anchor="middle" font-weight="400">수동 재정렬 → z → a</text>
<polyline points="1070,1115 1130,1115" fill="none" stroke="#486782" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="60" y="1360" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="21" text-anchor="start" font-weight="700">설정값은 실험용 예시이며 활성탄 포화를 확정하는 기준이 아닙니다.</text>
<text x="60" y="1400" fill="#19344d" font-family="NanumGothic, sans-serif" font-size="20" text-anchor="start" font-weight="400">리미트 없음: 위치·막힘 검출 불가 / 프린터 정지 실험 전용 / 팬 0% 정지 지원 확인 필요</text>
</svg>